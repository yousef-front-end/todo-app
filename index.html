<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>قائمة المهام</title>
<style>
body{font-family:Arial,sans-serif;background:#f4f6f8;margin:0;padding:20px}
.box{max-width:420px;margin:auto;background:#fff;padding:20px;border-radius:12px}
h1{text-align:center;color:#1e3a8a}
.row{display:flex;gap:8px}
input{flex:1;padding:10px;font-size:16px}
button{padding:10px 14px;background:#1e3a8a;color:#fff;border:0;border-radius:8px;font-size:16px}
ul{list-style:none;padding:0}
li{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-bottom:1px solid #eee}
li span{cursor:pointer}
li.done span{text-decoration:line-through;color:#888}
li button{background:#dc2626;padding:6px 10px}
</style>
</head>
<body>
<div class="box">
  <h1>قائمة المهام</h1>
  <div class="row">
    <input id="taskInput" placeholder="اكتب مهمة...">
    <button id="addBtn">إضافة</button>
  </div>
  <ul id="list"></ul>
</div>
<script>
let tasks = JSON.parse(localStorage.getItem("tasks")) || [];
const list = document.getElementById("list");
const input = document.getElementById("taskInput");

function save() {
  localStorage.setItem("tasks", JSON.stringify(tasks));
}

function render() {
  list.innerHTML = "";
  tasks.forEach((t, i) => {
    const li = document.createElement("li");
    if (t.done) li.className = "done";
    const span = document.createElement("span");
    span.textContent = t.text;
    span.onclick = () => { t.done = !t.done; save(); render(); };
    const del = document.createElement("button");
    del.textContent = "حذف";
    del.onclick = () => { tasks.splice(i, 1); save(); render(); };
    li.append(span, del);
    list.appendChild(li);
  });
}

document.getElementById("addBtn").onclick = () => {
  const text = input.value.trim();
  if (!text) return;
  tasks.push({ text, done: false });
  input.value = "";
  save();
  render();
};

render();
</script>
</body>
</html>
